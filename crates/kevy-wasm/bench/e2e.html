<!doctype html>
<meta charset="utf-8" />
<title>kevy-wasm e2e</title>
<body>
<pre id="log">kevy-wasm browser e2e…</pre>
<script type="module">
// End-to-end acceptance for the kevy-wasm loader stack. The headless
// driver awaits `window.__kevyResult`; open this page over http:// for a
// manual run (`?role=echo` in a second tab enables the cross-tab check,
// `?dualtab=0` skips it).
import { open } from "../pkg/kevy.js";

const WASM = "/target/wasm32-unknown-unknown/release/kevy_wasm.wasm";
const q = new URLSearchParams(location.search);
const td = new TextDecoder();
const logEl = document.getElementById("log");
const log = (s) => (logEl.textContent += "\n" + s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const assert = (cond, what) => {
  if (!cond) throw new Error("FAIL: " + what);
  log("ok: " + what);
};
const withTimeout = (p, ms, what) =>
  Promise.race([
    p,
    sleep(ms).then(() => {
      throw new Error("timeout: " + what);
    }),
  ]);

// Echo role: answer cross-tab pings for the main tab.
async function echo() {
  const db = await open({ wasm: WASM, name: "e2e-bus" });
  db.subscribe("e2e:ping", (payload) => db.publish("e2e:pong", payload));
  log("echo ready");
  return { role: "echo", ready: true };
}

async function memoryFace() {
  const db = await open({ wasm: WASM, broadcast: false });
  db.set("k", "v");
  assert(db.getText("k") === "v", "set/get text");
  db.set("bin", new Uint8Array([0, 1, 2, 255]));
  const bin = db.get("bin");
  assert(bin.length === 4 && bin[3] === 255, "binary value roundtrip");
  assert(db.incrby("n", 5) === 5 && db.incrby("n", -2) === 3, "incrby");
  assert(db.exists("k") && !db.exists("nope"), "exists");
  db.set("user:1", "a");
  db.set("user:2", "b");
  assert(db.keys("user:*").length === 2, "keys glob");
  db.set("flash", "x", { ttlMs: 150 });
  assert(db.pttl("flash") > 0, "pttl positive");
  await sleep(450);
  assert(db.get("flash") === undefined, "ttl expiry");
  assert(db.del("k") === true && db.get("k") === undefined, "del");
  let err = null;
  try {
    db.incrby("bin", 1);
  } catch (e) {
    err = e;
  }
  assert(err instanceof Error, "engine error surfaces as Error");
  await db.close();
}

async function persistReload(backend) {
  const name = "e2e-" + backend;
  let db = await open({ wasm: WASM, broadcast: false, persist: { name, backend } });
  db.flushall();
  for (let i = 0; i < 100; i++) db.set("key" + i, "value" + i);
  db.set("ttl-live", "x", { ttlMs: 60_000 });
  db.incrby("counter", 7);
  await db.close();

  db = await open({ wasm: WASM, broadcast: false, persist: { name, backend } });
  assert(db.dbsize() === 102, backend + ": reload dbsize (" + db.dbsize() + ")");
  assert(db.getText("key42") === "value42", backend + ": reload value");
  assert(db.getText("counter") === "7", backend + ": reload counter");
  assert(db.pttl("ttl-live") > 0, backend + ": ttl survives reload");
  await db.compact();
  await db.close();

  db = await open({ wasm: WASM, broadcast: false, persist: { name, backend } });
  assert(db.dbsize() === 102, backend + ": reload after compact");
  await db.close();
}

// A reply as plain JSON-able data: bulks as text, errors as "ERR:<message>".
const plain = (v) =>
  v instanceof Uint8Array
    ? td.decode(v)
    : Array.isArray(v)
      ? v.map(plain)
      : v instanceof Error
        ? "ERR:" + v.message
        : v;
const ask = (db, ...argv) => plain(db.cmd(...argv));

// A stream with a group: one delivery acknowledged, one claimed by a
// second consumer, a third consumer that has read nothing; and a geo set.
function populateStreams(db) {
  for (const [id, v] of [["1-1", "a"], ["2-1", "b"], ["3-1", "c"]]) {
    assert(ask(db, "XADD", "s", id, "f", v) === id, "XADD " + id);
  }
  const auto = ask(db, "XADD", "s", "*", "f", "d");
  assert(/^\d+-\d+$/.test(auto), "XADD * returns an id (" + auto + ")");
  assert(ask(db, "XGROUP", "CREATE", "s", "g", "0") === "OK", "XGROUP CREATE");
  const read = ask(db, "XREADGROUP", "GROUP", "g", "alice", "COUNT", "3", "STREAMS", "s", ">");
  assert(JSON.stringify(read[0][1].map((e) => e[0])) === '["1-1","2-1","3-1"]', "XREADGROUP delivers three");
  assert(ask(db, "XACK", "s", "g", "1-1") === 1, "XACK");
  const claimed = ask(db, "XAUTOCLAIM", "s", "g", "bob", "0", "0", "COUNT", "1");
  assert(claimed[1][0][0] === "2-1", "XAUTOCLAIM moves 2-1 to bob");
  assert(ask(db, "XGROUP", "CREATECONSUMER", "s", "g", "carol") === 1, "XGROUP CREATECONSUMER");
  assert(ask(db, "GEOADD", "city", "139.6917", "35.6895", "tokyo", "135.5023", "34.6937", "osaka") === 2, "GEOADD");
  return auto;
}

// What a reload must reproduce; none of it depends on the clock.
function streamState(db) {
  return JSON.stringify([
    ask(db, "XRANGE", "s", "-", "+"),
    ask(db, "XLEN", "s"),
    ask(db, "XPENDING", "s", "g"),
    [ask(db, "XINFO", "CONSUMERS", "s", "g")].flat().map((c) => (Array.isArray(c) ? c[1] : c)).sort(),
    ask(db, "GEODIST", "city", "tokyo", "osaka", "km"),
    ask(db, "GEOSEARCH", "city", "FROMMEMBER", "tokyo", "BYRADIUS", "500", "km", "ASC"),
  ]);
}

async function streamsGeo() {
  const db = await open({ wasm: WASM, broadcast: false });
  const auto = populateStreams(db);
  assert(ask(db, "XLEN", "s") === 4, "XLEN");
  const range = ask(db, "XRANGE", "s", "2-1", "+");
  assert(range.length === 3 && range[0][1][1] === "b", "XRANGE from 2-1");
  const read = ask(db, "XREAD", "COUNT", "1", "STREAMS", "s", "2-1");
  assert(read[0][0] === "s" && read[0][1][0][0] === "3-1", "XREAD after 2-1");
  const pending = ask(db, "XPENDING", "s", "g");
  pending[3].sort(); // the consumer order is not part of the contract checked here
  assert(JSON.stringify(pending) === '[2,"2-1","3-1",[["alice","1"],["bob","1"]]]', "XPENDING summary " + JSON.stringify(pending));
  const detail = ask(db, "XPENDING", "s", "g", "-", "+", "10", "alice");
  assert(detail.length === 1 && detail[0][0] === "3-1", "XPENDING for alice");
  assert(ask(db, "XREADGROUP", "GROUP", "g", "carol", "STREAMS", "s", ">")[0][1][0][0] === auto, "the fourth entry is new to the group");
  const km = Number(ask(db, "GEODIST", "city", "tokyo", "osaka", "km"));
  assert(km > 390 && km < 410, "GEODIST tokyo-osaka ~400 km (" + km + ")");
  assert(JSON.stringify(ask(db, "GEOSEARCH", "city", "FROMLONLAT", "139.7", "35.7", "BYRADIUS", "50", "km")) === '["tokyo"]', "GEOSEARCH by radius");
  for (const argv of [
    ["XREAD", "BLOCK", "0", "STREAMS", "s", "$"],
    ["XREADGROUP", "GROUP", "g", "alice", "BLOCK", "100", "STREAMS", "s", ">"],
  ]) {
    const r = db.cmd(...argv);
    assert(r instanceof Error && /cannot block/.test(r.message), argv[0] + " BLOCK is refused: " + (r && r.message));
  }
  await db.close();
}

async function persistStreams(backend) {
  const name = "e2e-streams-" + backend;
  const opts = { wasm: WASM, broadcast: false, persist: { name, backend } };
  let db = await open(opts);
  db.flushall();
  populateStreams(db);
  db.set("typed", "v");
  const before = streamState(db);
  await db.close();

  db = await open(opts);
  assert(streamState(db) === before, backend + ": streams and groups survive a reload from the log");
  assert(db.getText("typed") === "v", backend + ": typed and cmd writes share the log");
  assert(ask(db, "XREADGROUP", "GROUP", "g", "alice", "STREAMS", "s", ">")[0][1].length === 1, backend + ": the group resumes after its last delivery");
  const after = streamState(db);
  await db.compact();
  await db.close();

  db = await open(opts);
  assert(streamState(db) === after, backend + ": streams and groups survive a compacted image");
  await db.close();
}

async function localPubsub() {
  const db = await open({ wasm: WASM, broadcast: false });
  const got = new Promise((r) =>
    db.subscribe("ch", (p, c) => r(td.decode(p) + "@" + c)),
  );
  const pgot = new Promise((r) =>
    db.psubscribe("c*", (p, c, pat) => r(pat + ">" + c)),
  );
  db.publish("ch", "m1");
  assert((await withTimeout(got, 2000, "local message")) === "m1@ch", "local pubsub");
  assert((await withTimeout(pgot, 2000, "pattern message")) === "c*>ch", "pattern pubsub");
  await db.close();
}

async function crossTab() {
  const db = await open({ wasm: WASM, name: "e2e-bus" });
  const pong = new Promise((r) => db.subscribe("e2e:pong", (p) => r(p)));
  // At-most-once, no backlog: retry until the echo tab is up.
  const timer = setInterval(() => db.publish("e2e:ping", "hello-tab"), 100);
  let payload;
  try {
    payload = await withTimeout(pong, 15_000, "cross-tab pong");
  } finally {
    clearInterval(timer);
  }
  assert(td.decode(payload) === "hello-tab", "cross-tab payload roundtrip");
  await db.close();
}

async function main() {
  const tests = [];
  const run = async (name, f) => {
    await f();
    tests.push(name);
  };
  await run("memory", memoryFace);
  await run("persist-opfs", () => persistReload("opfs"));
  await run("persist-idb", () => persistReload("idb"));
  await run("streams-geo", streamsGeo);
  await run("persist-streams-opfs", () => persistStreams("opfs"));
  await run("persist-streams-idb", () => persistStreams("idb"));
  await run("pubsub-local", localPubsub);
  if (q.get("dualtab") !== "0") await run("pubsub-crosstab", crossTab);
  log("ALL PASS");
  return { role: "main", pass: true, tests };
}

window.__kevyResult = (q.get("role") === "echo" ? echo() : main()).catch(
  (e) => {
    log(String(e && (e.stack || e)));
    return { pass: false, error: String(e && (e.stack || e)) };
  },
);
</script>
