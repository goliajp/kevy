[package]
name = "kevy-wasm"
description = "WebAssembly bindings for kevy — the embedded Redis-compatible KV engine behind a hand-written C ABI for browsers and JS runtimes."
version = "5.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-wasm"
readme = "README.md"
keywords = ["kevy", "redis", "kv", "wasm", "browser"]
categories = ["database-implementations", "caching", "wasm"]
# The crates.io package ships sources only: the browser test/bench
# harness and the built wasm binary (an npm concern) stay out.
exclude = ["bench/", "pkg/kevy.wasm"]

[lints]
workspace = true

# `cdylib` is the browser artifact (a bare `.wasm` module loaded by the
# hand-written `pkg/kevy.js`); `rlib` keeps the crate testable as a plain
# Rust library on native targets, where the unit tests drive the C ABI
# functions directly.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, at every feature a browser can actually run.
#
# KV + TTL + pub/sub (`core`), the AOF frame machinery behind
# host-mediated persistence (`persist`), and the three that make kevy more
# than a key-value store: secondary indexes and materialised views
# (`index`), full-text search (`text`), and vector search (`vector`).
#
# It was `core` + `persist` alone, which cost 714 KB less and made the
# terminal on the landing page unable to run a single one of the verbs
# that page is about — `IDX.CREATE` came back "unknown command" beside
# prose promising indexes live in the engine. A demo that cannot do the
# thing being claimed argues against the claim.
#
# The three left out are left out because a browser has nowhere to put
# them, not to save bytes: `replicate` needs a network peer, `listener`
# needs a TCP socket, and `tier` needs a disk directory — its own docs
# say a wasm store rejects the config at open.
kevy-embedded = { path = "../kevy-embedded", version = "5.4.0", default-features = false, features = ["core", "persist", "index", "text", "vector"] }
# Clock access: TTL frames record absolute deadlines, anchored to the
# host-fed wall clock.
kevy-store = { path = "../kevy-store", version = "5.4.0" }
# AOF frame format: the pump emits and parses the same multi-bulk frames
# (and magic header) a kevy-written on-disk AOF carries.
kevy-persist = { path = "../kevy-persist", version = "5.4.0" }
kevy-resp = { path = "../kevy-resp", version = "5.4.0" }
