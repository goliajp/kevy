[package]
name = "kevy-cluster-rw"
description = "Read/write-split cluster client for kevy — routes writes to primary, reads to replicas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-cluster-rw"
readme = "README.md"
keywords = ["kevy", "redis", "cluster", "client", "replication"]
categories = ["database", "api-bindings"]


# v6 — not packaged: these reference a dependency the published manifest
# cannot declare, and `cargo package` would ship source that does not
# compile. Needs kevy-testnet and the kevy server; neither is resolvable from a
# published kevy-cluster-rw.
exclude = ["tests/rw_split.rs"]
[lints]
workspace = true

[dependencies]
kevy-resp = { path = "../kevy-resp", version = "6.1.0" }
kevy-resp-client = { path = "../kevy-resp-client", version = "6.1.0" }

[dev-dependencies]
kevy-testnet = { path = "../kevy-testnet" }
# Integration tests spin up real kevy primary + replica Runtimes to
# verify routing end-to-end.
kevy = { path = "../kevy", version = "6.1.0" }
kevy-rt = { path = "../kevy-rt", version = "6.1.0" }
kevy-replicate = { path = "../kevy-replicate", version = "6.1.0" }
