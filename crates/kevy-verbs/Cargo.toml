[package]
name = "kevy-verbs"
description = "The single-shard command layer kevy's server and embedded engine share — argv parsing, reply wording, execution against one keyspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-verbs"
readme = "README.md"
keywords = ["kevy", "redis", "resp", "commands"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
kevy-store = { path = "../kevy-store", version = "7.0.0" }
kevy-resp = { path = "../kevy-resp", version = "7.0.0" }
kevy-num = { path = "../kevy-num", version = "7.0.0" }
kevy-hash = { path = "../kevy-hash", version = "7.0.0" }
kevy-geo = { path = "../kevy-geo", version = "7.0.0", optional = true }

[features]
default = []
# The stream (X*) and geo (GEO*) commands. Off by default: a caller that
# serves neither family does not carry them.
streams-geo = ["dep:kevy-geo"]
