[package]
name = "kevy-index"
description = "Declarative secondary indexes over prefix domains: range/unique kinds, derived-by-construction, cursor pagination."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-index"
readme = "README.md"
keywords = ["index", "secondary-index", "range-query", "kv", "database"]
categories = ["data-structures", "database-implementations"]

[lints]
workspace = true

[features]
# `TidyProbe` and `Segment::tidy_probe`, read around each repack step by
# the tail-latency harness (bench/repack-tail.sh); off in every shipped
# build.
tidy-trace = []

[dependencies]
kevy-hash = { path = "../kevy-hash", version = "7.0.0" }
kevy-time = { path = "../kevy-time", version = "7.0.0" }
kevy-text = { path = "../kevy-text", version = "7.0.0" }
