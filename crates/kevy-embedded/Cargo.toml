[package]
name = "kevy-embedded"
description = "Embedded mode for kevy — in-process Redis-compatible KV without the server/runtime."
# kevy-embedded tracks its own additive growth (Store::Clone + pubsub bus
# from v1.1.0). Patch 1.1.3 picks up the workspace 1.2.0 chain that
# carries the kevy-persist AOF_MAGIC header (forward-compat) + the
# replay_aof loud-summary fix from 1.1.1. 1.1.5 follows the workspace
# 1.4.2 chain and an internal split of `pubsub.rs` (no API change).
version = "6.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-embedded"
readme = "README.md"
keywords = ["kevy", "redis", "kv", "embedded", "cache"]
categories = ["database-implementations", "caching", "embedded"]


# v6 — not packaged: these reference a dependency the published manifest
# cannot declare, and `cargo package` would ship source that does not
# compile. Two of thirty-nine. The other thirty-seven ship and compile — excluding
# the whole suite to silence two files would throw away working tests.
exclude = ["examples/embed_vs_server.rs", "tests/server_replica_e2e.rs"]
[lints]
workspace = true

# Build archetypes for the IoT / edge cut: `core` alone is the minimal
# in-memory KV+TTL form (`default-features = false, features = ["core"]`);
# every other feature adds one subsystem back. `default` keeps the full
# 3.x surface so existing consumers see no change.
[features]
default = ["core", "persist", "index", "text", "vector", "replicate", "listener", "tier"]
# Marker for the base surface (KV + TTL + pubsub + atomic/pipeline).
# Always on in practice — named so the minimal archetype is spellable.
core = []
# Snapshot + AOF durability (kevy-persist): `with_persist`, `save_snapshot`,
# `rewrite_aof`, AOF replay on open.
persist = ["dep:kevy-persist", "dep:kevy-sys"]
# Secondary indexes + materialized views (kevy-index).
index = ["dep:kevy-index", "dep:kevy-window"]
# Full-text index segments (needs `index` for the segment plumbing).
text = ["index", "dep:kevy-text"]
# ANN / HNSW vector index segments (needs `index`).
vector = ["index", "dep:kevy-vector"]
# Replication (embed-as-replica + embed-as-writer) and the CDC feed.
# Needs `persist`: replicated frames replay through the AOF verb table.
replicate = ["persist", "dep:kevy-replicate"]
# Read-only RESP listener (ops tooling against a live embedded store).
listener = []
# Transparent tiering (capacity arc): `with_tier_budget` + the cold
# value log under `<data_dir>/tier/`. Needs `persist` (a disk dir);
# wasm / mem:// stores reject the config at open. kevy-sys provides
# the memory-bound probe behind the `auto` / percent budget forms.
tier = ["persist", "dep:kevy-sys"]

[dependencies]
kevy-store = { path = "../kevy-store", version = "6.2.0" }
kevy-index = { path = "../kevy-index", version = "6.2.0", optional = true }
kevy-text = { path = "../kevy-text", version = "6.2.0", optional = true }
kevy-vector = { path = "../kevy-vector", version = "6.2.0", optional = true }
kevy-persist = { path = "../kevy-persist", version = "6.2.0", optional = true }
kevy-hash = { path = "../kevy-hash", version = "6.2.0" }
# The tiering budget's auto-detection probe (cgroup / meminfo /
# hw.memsize) rides the target-gated table below — kevy-sys never
# links on wasm32 (same pattern as kevy-store's kevy-vlog dep).
# Phase 2 (v1.20+): embed-as-read-replica reuses the server-side
# replication wire client (kevy-replicate) so the same protocol drives
# both server replicas and embed replicas. `default-features = false`
# keeps the dep lean even though kevy-replicate has no optional features
# today — explicit intent for when it grows them.
kevy-replicate = { path = "../kevy-replicate", version = "6.2.0", default-features = false, optional = true }
# kevy-resp: `verb_arity` (the arity column both surfaces read, so the
# entry checks below do not restate the server's numbers as literals)
# and `parse_command` (handshake decoding) inside
# the Phase 3 / v1.21 embed-as-writer replica source listener.
kevy-resp = { path = "../kevy-resp", version = "6.2.0" }

# The tier feature's OS probe: declared only off-wasm so `dep:kevy-sys`
# is a no-op on wasm32 and kevy-sys never enters the wasm graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kevy-window = { path = "../kevy-window", version = "6.2.0", optional = true }
kevy-sys = { path = "../kevy-sys", version = "6.2.0", optional = true }

[dev-dependencies]
kevy-testnet = { path = "../kevy-testnet" }
# v2.0.20: the `kevy` dev-dep blocks `cargo publish kevy-embedded`
# because the chain publishes `kevy` LATER (kevy depends on the
# embedded surface transitively, so kevy-embedded MUST publish
# first). cargo strips path-only dev-deps (no `version` field) from
# the published Cargo.toml, so leaving it as a path-only dev-dep
# lets local `cargo test` use it (`tests/server_replica_e2e.rs`
# needs `kevy::KevyCommands`) while keeping the publish path
# unblocked.
kevy = { path = "../kevy" }
kevy-rt = { path = "../kevy-rt", version = "6.2.0" }
# tests/dispatch_oracle.rs: throwaway data dir for the oracle server.
kevy-tmpdir = { path = "../kevy-tmpdir", version = "6.2.0" }
kevy-seg = { path = "../kevy-seg", version = "6.2.0" }
kevy-sys = { path = "../kevy-sys", version = "6.2.0" }
# Used by examples/embed_vs_server.rs to give the Rust caller a single
# unified blocking-client surface so the embed-vs-server bench compares
# the same Rust code against different backends (kevy embed vs kevy
# server vs valkey vs redis). Dev-only; `kevy-client` is published
# BEFORE `kevy-embedded` in the chain.
kevy-client = { path = "../kevy-client" }
