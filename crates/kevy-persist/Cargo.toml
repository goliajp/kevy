[package]
name = "kevy-persist"
description = "kevy persistence — RDB-style snapshots + AOF, pure Rust, zero deps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["redis", "persistence", "rdb", "aof", "snapshot"]
categories = ["database-implementations", "filesystem"]

[lints]
workspace = true

[dependencies]
kevy-store = { path = "../kevy-store", version = "5.3.0" }
kevy-resp = { path = "../kevy-resp", version = "5.3.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kevy-sys = { path = "../kevy-sys", version = "5.3.0" }

[dev-dependencies]
kevy-tmpdir = { path = "../kevy-tmpdir", version = "5.3.0" }
