[package]
name = "kevy-bench"
description = "Pure-Rust micro-benchmark harness for kevy — zero deps, no criterion. Median/p95 timing + A/B speedup ratios."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-bench"
keywords = ["benchmark", "bench", "perf", "median", "kevy"]
categories = ["development-tools::testing", "no-std"]
# v6: published. The question this comment used to leave open — "reusable
# enough as a standalone bench library?" — was answered by measurement
# rather than taste: four published stones ship tests/perf_gate.rs and an
# examples/bench_*.rs that import this crate, while `cargo package` drops a
# path-only dev-dependency, so those crates arrive on crates.io carrying
# source they cannot compile. A stone promises "any project could take
# these"; that promise needs this harness on the registry.
#
# examples/ is excluded because it drives the very crates that depend on
# this one (kevy-store, kevy-map, kevy-ring, …). Versioning those
# dev-dependencies would make the publish chain cyclic and unorderable.
# Excluded, this crate is a true leaf: zero dependencies of any kind, first
# in the chain.
exclude = ["examples/**"]

[lints]
workspace = true

[dependencies]

# The six-stone baseline runner (`examples/stones/`) drives each stone crate's
# public API. Dev-only so the harness library itself stays zero-dependency.
[dev-dependencies]
kevy-alloc  = { path = "../kevy-alloc" }
kevy-config = { path = "../kevy-config" }
kevy-map    = { path = "../kevy-map" }
kevy-ring   = { path = "../kevy-ring" }
kevy-store  = { path = "../kevy-store" }
kevy-text   = { path = "../kevy-text" }
kevy-vector = { path = "../kevy-vector" }
