[package]
name = "kevy-madvise"
description = "Pure-Rust madvise hints (MADV_HUGEPAGE) — no libc crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-madvise"
readme = "README.md"
keywords = ["madvise", "hugepage", "thp", "memory", "linux"]
categories = ["os", "memory-management", "external-ffi-bindings"]

# `std` (default) keeps the crate exactly as before; without it the crate
# is `no_std` (it is pure `core` already — the Linux ffi arms compile away
# on OS-less targets, everything else no-ops).
[features]
default = ["std"]
std = []
alloc = []

[lints]
workspace = true

[dependencies]
