[package]
name = "kevy-sql"
description = "Declaration-time SQL compiler for kevy: CREATE TABLE/INDEX/VIEW compile ONCE into explicit TABLE.DECLARE / VIEW.CREATE commands and query cards — never a query engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-sql"
readme = "README.md"
keywords = ["sql", "schema", "compiler", "migration", "kevy"]
categories = ["database", "command-line-utilities"]

[lints]
workspace = true

# Runtime closure: first-party crates only, and nothing here runs inside
# a serving engine. kevy-index supplies the column type compiled
# declarations carry (the engine's own `ValType`, so the compiler and the
# engine cannot name a type differently); the round-trip test also feeds
# every compiled TABLE.DECLARE argv back through the engine's wire
# parser, so the two cannot drift on the grammar either.
[dependencies]
kevy-index = { path = "../kevy-index", version = "7.0.0" }
# kevy-scalar: the V1 constant folder (`SELECT lower('X')` with no
# FROM) — still a build/CLI-time face, never inside a serving engine.
kevy-scalar = { path = "../kevy-scalar", version = "7.0.0" }
