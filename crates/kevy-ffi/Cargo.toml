[package]
name = "kevy-ffi"
description = "C ABI for embedding kevy — one generic command entry (argv in, RESP out), open/close, and polled pub/sub. Every non-Rust language binding is a thin shell over this."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Not a crates.io crate: the native doors ship as prebuilt binaries through
# npm / CocoaPods / Maven, and nothing published depends on this. Flip to
# publish = true (and add it to release.yml's chain) if that ever changes.
publish = false

[lib]
# cdylib for dynamic loaders (bun:ffi, P/Invoke, dlopen), staticlib for
# C/C++/Go link-time embedding, rlib so Rust tests can call the ABI directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kevy-embedded = { path = "../kevy-embedded", version = "6.0.0" }

[lints]
workspace = true
