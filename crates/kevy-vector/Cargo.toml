[package]
name = "kevy-vector"
description = "Approximate nearest-neighbor core: HNSW graph with cosine/L2/inner-product distances, tombstone deletes, bounded rebuild."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-vector"
readme = "README.md"
keywords = ["ann", "hnsw", "vector-search", "knn", "embeddings"]
categories = ["data-structures", "database-implementations"]

[lints]
workspace = true

[dependencies]

[features]
# The distance counter in `count`. Off by default: it sits inside
# `Distance::eval`, and a release build must not carry it.
count-distances = []

# The counter lives inside `Distance::eval`; without it this example
# would build and print numbers that mean nothing. `required-features`
# makes cargo refuse instead.
[[example]]
name = "recall_vs_cost"
required-features = ["count-distances"]
