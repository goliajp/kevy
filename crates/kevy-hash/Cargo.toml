[package]
name = "kevy-hash"
description = "FxHash + fmix64 hasher for single-trust-domain keyspaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-hash"
readme = "README.md"
keywords = ["hash", "hasher", "fxhash", "fmix", "hashmap"]
categories = ["algorithms", "data-structures"]

# `std` (default) keeps the `FxHashMap` / `FxHashSet` aliases over
# `std::collections`; without it the crate is `no_std` (the hashers and
# the KevyHash trait are pure `core` — no_std callers pair them with
# `kevy-map` instead of std's tables).
[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true

[dependencies]

[dev-dependencies]
kevy-bench = { path = "../kevy-bench", version = "6.1.0" }
