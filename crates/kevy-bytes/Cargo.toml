[package]
name = "kevy-bytes"
description = "24-byte small-byte-string with inline SSO. Pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-bytes"
readme = "README.md"
keywords = ["sso", "small-string", "bytes", "inline"]
categories = ["data-structures", "memory-management"]

# `std` (default) keeps the crate exactly as before; `alloc` alone gives
# the full SmallBytes surface under `no_std` (SSO + heap rep both live on
# the `alloc` allocator; only the x86_64 AVX2 *runtime detection* needs
# std, and it degrades to the SWAR scanner).
[features]
default = ["std"]
std = ["alloc", "kevy-hash/std"]
alloc = ["kevy-hash/alloc"]

[lints]
workspace = true

[dependencies]
kevy-hash = { path = "../kevy-hash", version = "6.1.0", default-features = false }

[dev-dependencies]
kevy-bench = { path = "../kevy-bench", version = "6.1.0" }
