[package]
name = "kevy-store"
description = "kevy keyspace + value types + expiry — pure Rust, zero deps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["redis", "keyspace", "kv", "database", "ttl"]
categories = ["database-implementations", "data-structures", "caching"]

# Dual-state build: `std` (default) is byte-for-byte the crate as before.
# `--no-default-features --features alloc,external-clock` is the `no_std`
# core form: the OS clock arms are replaced by the host-fed atomic
# clock (same contract the wasm arm pioneered) and the bio-drop channel
# (an std mpsc) compiles away.
[features]
default = ["std"]
# `dep:kevy-vlog` rides the target-gated table below: the tier backend
# (capacity arc) exists only off-wasm — on wasm32 the activation is a
# no-op and the tier module compiles out.
std = ["alloc", "kevy-hash/std", "kevy-bytes/std", "kevy-map/std", "kevy-ranktree/std", "dep:kevy-vlog", "dep:kevy-seg"]
alloc = ["kevy-hash/alloc", "kevy-bytes/alloc", "kevy-map/alloc", "kevy-ranktree/alloc"]
# Feed the clocks from the embedding host (`set_clock_ns` /
# `set_wall_clock_ms`) instead of the OS — mandatory without `std`.
external-clock = []

[lints]
workspace = true

[dependencies]
kevy-hash = { path = "../kevy-hash", version = "6.2.2", default-features = false }
kevy-bytes = { path = "../kevy-bytes", version = "6.2.2", default-features = false }
kevy-map = { path = "../kevy-map", version = "6.2.2", default-features = false }
kevy-ranktree = { path = "../kevy-ranktree", version = "6.2.2", default-features = false }

# The tiering vlog needs a real filesystem (unix positional IO) — never
# on wasm32. Optional: activated by the `std` feature off-wasm only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kevy-vlog = { path = "../kevy-vlog", version = "6.2.2", optional = true }
kevy-seg = { path = "../kevy-seg", version = "6.2.2", optional = true }

[dev-dependencies]
kevy-bench = { path = "../kevy-bench", version = "6.2.2" }
kevy-tmpdir = { path = "../kevy-tmpdir", version = "6.2.2" }
