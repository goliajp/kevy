[package]
name = "kevy-cli"
description = "kevy operations CLI: redis-cli-style REPL plus the migration toolchain (import/export/verify/diff/inspect/digest)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["redis", "cli", "repl", "resp", "kevy"]
categories = ["command-line-utilities", "database"]


# v6 — not packaged: these reference a dependency the published manifest
# cannot declare, and `cargo package` would ship source that does not
# compile. These four drive a live server through kevy-testnet, which is dev-only
# scaffolding and never published.
exclude = ["tests/backfill_keys_union.rs", "tests/lint_shapes.rs", "tests/migrate_roundtrip.rs", "tests/sql_compile_apply.rs"]
[lints]
workspace = true

[lib]
name = "kevy_cli"
path = "src/lib.rs"

[[bin]]
name = "kevy-cli"
path = "src/main.rs"

[dependencies]
kevy-tmpdir = { path = "../kevy-tmpdir", version = "6.2.0" }
kevy-embedded = { path = "../kevy-embedded", version = "6.2.0" }
kevy-persist = { path = "../kevy-persist", version = "6.2.0" }
kevy-resp = { path = "../kevy-resp", version = "6.2.0" }
kevy-resp-client = { path = "../kevy-resp-client", version = "6.2.0" }
kevy-scalar = { path = "../kevy-scalar", version = "6.2.0" }
kevy-sql = { path = "../kevy-sql", version = "6.2.0" }

[dev-dependencies]
kevy-testnet = { path = "../kevy-testnet" }
