[package]
name = "kevy-cli"
description = "kevy operations CLI: redis-cli-style REPL plus the migration toolchain (import/export/verify/diff/inspect/digest)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["redis", "cli", "repl", "resp", "kevy"]
categories = ["command-line-utilities", "database"]

[lints]
workspace = true

[lib]
name = "kevy_cli"
path = "src/lib.rs"

[[bin]]
name = "kevy-cli"
path = "src/main.rs"

[dependencies]
kevy-embedded = { path = "../kevy-embedded", version = "3.17.4" }
kevy-persist = { path = "../kevy-persist", version = "3.17.4" }
kevy-resp = { path = "../kevy-resp", version = "3.17.4" }
kevy-resp-client = { path = "../kevy-resp-client", version = "3.17.4" }
