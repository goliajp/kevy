[package]
name = "kevy-sys"
description = "Hand-curated OS bindings for kevy — sockets + readiness poller."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/kevy-sys"
homepage.workspace = true
readme = "README.md"
keywords = ["redis", "epoll", "kqueue", "socket", "reactor"]
categories = ["os", "network-programming", "external-ffi-bindings"]

[lints]
workspace = true

[features]
default = ["std"]
# Everything but `os` (the C library's memory and process declarations,
# which no_std crates such as kevy-alloc and kevy-madvise take).
std = []
# `thread_usage`: a thread's CPU time, faults and context switches, read
# around a stretch of code by instrumented builds; off in every shipped
# build.
thread-usage = []

[dependencies]
