[package]
name = "kevy-client"
description = "Unified client for kevy — switch between in-process embedded and TCP server backends with a single URL."
# Inherits the workspace version since 6.2.1. It used to keep its own 2.x
# line on the theory that a client's API grows faster than the server's;
# what that bought was three releases (6.0.0, 6.1.0, 6.2.0) in which this
# manifest pinned its siblings at 6.x while crates.io still served a 2.2.0
# that pinned them at ^5.0 — the publish loop saw "2.2.0 already exists"
# and skipped it. One version for every crate, moved together, every time.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-client"
readme = "README.md"
keywords = ["kevy", "redis", "kv", "client", "embedded"]
categories = ["database", "caching", "api-bindings"]


# v6 — not packaged: these reference a dependency the published manifest
# cannot declare, and `cargo package` would ship source that does not
# compile. They use kevy-testnet (a live server, or a mock that reads whole
# requests), which is never published.
exclude = ["tests/wrap_parity.rs", "tests/subscribe.rs", "tests/transaction.rs"]
[lints]
workspace = true

[dependencies]
kevy-embedded = { path = "../kevy-embedded", version = "6.4.0" }
kevy-resp = { path = "../kevy-resp", version = "6.4.0" }
kevy-resp-client = { path = "../kevy-resp-client", version = "6.4.0" }
kevy-hash = { path = "../kevy-hash", version = "6.4.0" }

[dev-dependencies]
kevy-testnet = { path = "../kevy-testnet" }
kevy-tmpdir = { path = "../kevy-tmpdir", version = "6.4.0" }
# tests/wrap_parity.rs boots an in-process kevy-rt reactor with the
# full kevy command set (same harness as crates/kevy/tests/*). Path-
# only (no version) so publish strips them — mirrors kevy's own
# dev-dependency on kevy-client; the normal-dep graph stays acyclic.
kevy = { path = "../kevy", version = "6.4.0" }
kevy-rt = { path = "../kevy-rt", version = "6.4.0" }
# the documentation's in-process servers: a cluster needs the server's
# config, and an encrypted port stand-in runs the Noise responder
kevy-config = { path = "../kevy-config", version = "6.4.0" }
kevy-noise = { path = "../kevy-noise", version = "6.4.0" }
