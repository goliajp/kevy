[package]
name = "kevy-elect"
description = "Quorum-based primary failover for kevy (v3 cluster series, Phase 1.5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kevy-elect"
readme = "README.md"
keywords = ["election", "quorum", "failover", "kevy", "replication"]
categories = ["database", "network-programming"]


# v6 — not packaged: these reference a dependency the published manifest
# cannot declare, and `cargo package` would ship source that does not
# compile. Needs kevy-testnet, which is never published.
exclude = ["tests/transport_e2e.rs"]
[lints]
workspace = true

[dependencies]
kevy-resp = { path = "../kevy-resp", version = "6.2.1" }

[dev-dependencies]
kevy-testnet = { path = "../kevy-testnet" }
