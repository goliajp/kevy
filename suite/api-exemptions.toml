# Items the API guidelines gate flags that are right as they are.
# Each entry: rule (one of the gate's rules), item (the public path the gate
# prints) and why — the reason it stays, in a sentence a reviewer can check.

# layer 0

[[exempt]]
rule = "trait-open"
item = "kevy_hash::KevyHash"
why = "kevy-map keys a map by any K: KevyHash + Eq, so key types outside this crate implement it; the trait docs state what an implementation must uphold (equal values hash equally, borrowed forms agree, bits avalanche)"

[[exempt]]
rule = "trait-open"
item = "kevy_text::token::Tokenizer"
why = "an analysis callers supply for their own pipelines or tests; the trait docs state the contract (a pure function of the bytes, total over invalid UTF-8)"

[[exempt]]
rule = "enum-exhaustive"
item = "kevy_text::segment::segment_opts::SortOrder"
why = "the two directions of a total order; no third can exist, and callers match both"

# layer 1

[[exempt]]
rule = "enum-exhaustive"
item = "kevy_map::raw_entry::RawEntryMut"
why = "a key is either present or absent in the map, so Occupied and Vacant are the only states an entry can be in; callers match both arms, as with std's hash_map::Entry"

[[exempt]]
rule = "get-prefix"
item = "kevy_map::map::KevyMap::get_mut"
why = "the collection lookup by key with mutable access, named as std's HashMap::get_mut; it is not a field getter"

[[exempt]]
rule = "get-prefix"
item = "kevy_map::raw_entry::RawOccupiedEntryMut::get_mut"
why = "mutable access to the entry's value, named as std's OccupiedEntry::get_mut beside get and into_mut; it is not a field getter"
