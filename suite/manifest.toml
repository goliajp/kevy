# The kevy test suite — the single source of truth for what is checked.
#
# Read by tools/suite.py. Three tiers, by inheritance: a check declares
# the LOWEST tier it runs in and runs in every tier above it, so
# checks(precommit) ⊆ checks(prerelease) ⊆ checks(full) holds by
# construction rather than by discipline.
#
#   precommit   pins the current version's goals + fast regressions.
#   prerelease  adds the release claims and iron rules.
#   full        adds everything: the problem-hunting surface.
#
# Fields:
#   id        unique name (the scoreboard key)
#   area      hygiene | release-pins | arch | doc | perf | mem | disk |
#             compat | dialect | feature | case | doors | cov
#   tier      lowest tier this runs in
#   cmd       what to run, from the repo root
#   expected  seconds, warm tree, quiet machine — audited against the
#             tier budgets so "precommit is fast" is arithmetic, not hope
#   timeout   hard per-check ceiling (seconds)
#   requires  infrastructure this needs; a missing requirement is a loud
#             NOT-RUN, never a silent pass:
#             server-debug | server-release | linux | box | node |
#             chromium | docker | device | ci
#   advisory  true = reported but does not fail the tier (used only for
#             checks whose red can be a legitimate state, e.g. the
#             published-wasm divergence between releases)
#
# Exploration probes (v125-*, axis_*, loopback_*) are deliberately not
# here: instruments for finding, not standards for holding. See the RFC.

[suite]
manifest_floor = 43

[suite.budgets]
precommit = 300
prerelease = 5400

