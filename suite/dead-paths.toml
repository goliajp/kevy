why = """
kevy-scope's slot migration matcher, demangled without a path. The v1
finding accepted it and wrote the rule for this moment: if the same symbol
recurs in the next run's growth it earns an entry with the differing values.
It recurred, at the same value, so what varies is not the count but whether
the region runs at all — a migration match that happens only when a test
leaves a slot mid-move.
"""

