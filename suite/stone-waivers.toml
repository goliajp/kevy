# Where the stones fall short of the bar today, each with a reason and what
# would close it.
#
# The bar in `[bar]` is what a stone is supposed to be. It is not aspiration:
# every figure in it was chosen from the first stone report (2026-08-27)
# rather than from taste, and every stone that misses it is named below with
# the measurement that says so.
#
# Checked by tools/check_stones.py against bench/STONE-REPORT.json. Two rules
# make this a ratchet rather than a wish list:
#
#   - a waiver for a stone that now meets the bar FAILS. The list must not
#     rot; passing is how a waiver is removed, not by being forgotten.
#   - the list may only shrink, and `[bar].max_waivers` is what says so.
#     Adding a waiver means raising that number in the same commit, with the
#     reason — the deliberate act, the same way `--accept-growth` works for a
#     set-ratchet. Until 2026-08-29 this rule was prose only: a new waiver
#     carrying a reason and a closes_when was accepted like any other, and a
#     ratchet nobody counts is a wish.

[bar]
# How many waivers may stand. Zero: the four that were here are gone and
# nothing has replaced them. Raising this is the deliberate act.
max_waivers = 0

# Unpack the published form outside the repository and its tests pass there.
# This is the operational form of "any project could take these".
lifts = true

# A boolean `tested` proves nothing: kevy-uring lifts, builds and passes
# with zero tests. The bar needs a count, and the count is not zero.
min_tests = 1

# 15 of 17 stones are already at 100%, so this costs almost nothing to
# require and stops the two that are not from being joined.
doc_pct = 100.0

# Prose is unverified; a doctest is compiled and run. 12 of 17 stones carry
# no executable example at all, so 1 is a floor to start a ratchet from, not
# the destination — the destination is every public item.
min_examples = 1

# A crate absent from the execution corpus reports zero dead regions and
# outranks every crate that was measured. That is no score, not a good one.
must_be_measured = true

# Clean against the last published version. All 17 are clean today across
# 3,791 checks; recording that now is what makes the first v6 break visible.
semver_clean = true

# ---------------------------------------------------------------------------
# No waivers.
#
# The four that stood here — kevy-bytes, kevy-hash, kevy-map and kevy-ring,
# each waived from `lifts` and `min_tests` because kevy-bench was not on
# crates.io — were removed on 2026-08-28. They were a hand-written
# declaration of something the gate can compute: `cargo package` strips path
# dependencies and resolves what is left against crates.io, so between a
# version bump and the publish that follows it, ANY crate with a
# version-gated sibling is unliftable for that reason alone. stonegate now
# names those readings as NOT TAKEN, by crate and by the dependency that
# could not be selected, and says out loud that they are not passes.
#
# It is self-limiting in a way a waiver is not: after the publish the version
# exists, and a crate that still cannot lift fails here for real.
