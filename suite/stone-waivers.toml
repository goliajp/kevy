# first stone report taken on Linux: lift=True, 15 tests, 100% documented,
# one executable example, 238 dead regions out of 853 measured. Every rule
# it was waived from, it meets — and always did. What was wrong was the
# instrument: the report had only ever been taken on macOS, where the crate
# is `#![cfg(target_os = "linux")]` and therefore an empty module, and a
# stone the producer cannot see reads as a stone that scores zero.
