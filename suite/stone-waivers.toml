# measured / tests

[[waiver]]
crate = "kevy-uring"
rules = ["min_tests", "must_be_measured"]
reason = """
Linux-only io_uring bindings. Zero regions in the corpus and zero tests —
and the two are one fact, not two: the corpus runs on the enforcing platform
in CI, and this local report was taken on macOS where the crate does not
compile at all. What the report cannot say is whether it has tests ON Linux.
"""
closes_when = "the corpus is recorded on Linux and this row is re-read; if it is still zero there, the crate genuinely has no tests and owes them"

