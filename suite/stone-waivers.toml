# docs

[[waiver]]
crate = "kevy-seg"
rules = ["doc_pct"]
reason = "90% — 5 of 7 items in manifest.rs are documented; the rest of the crate is at 100%."
closes_when = "manifest.rs's two undocumented items are documented"

[[waiver]]
crate = "kevy-tmpdir"
rules = ["doc_pct"]
reason = "80% — 4 of 5 public items."
closes_when = "the fifth item is documented"

