# kevy — pure-Rust, 0-dependency, Redis-compatible KV server.
#
# Principle (locked at L2): the ONLY C we touch is the unavoidable OS-boundary
# libc (sockets / pollers / mmap / time), bound by hand with `unsafe extern "C"`.
# Every algorithm and data structure is written in Rust — no third-party crate,
# no C library for logic. See crates/kevy-sys for the sole libc boundary.
#
# Carved exemptions (per-crate, NOT workspace-wide):
# 1. `crates/kevy-client-async` may depend on tokio / smol / async-std behind
#    feature gates — the Rust async ecosystem has no std-only viable
#    substrate. Rules + audit recorded in memory
#    `feedback-pure-rust-no-c-principle.md` + RFC
#    `2026-06-18-v3-cluster.md` F5.
# 2. `crates/kevy-lua` (v1.27) depends on `luna-core` — GOLIA's own pure-Rust
#    Lua runtime, itself 0-dep (CI-enforced via cargo-deny on luna's side).
#    Adding luna-core to kevy adds **0 new transitive third-party crates**.
#    Verify (filter workspace path-deps + (*) repeats):
#      cargo tree -p kevy-lua --prefix none \
#        | grep -E " v[0-9]" | grep -v "(\*)" \
#        | grep -v "(/Users/doracawl/workspace/goliajp/kevy/" | wc -l
#    must equal 1 (just luna-core). Rules + decision history in memory
#    `project-lua-runtime-direction.md`.
# 3. `crates/kevy-lua-host` (v1.27 P7) is the kevy-side glue that lets
#    kevy-lua's `Bridge` reach `&mut Store` via a tiny scoped-pointer
#    indirection. Pulls one (1) crates.io dep transitively: same
#    `luna-core` as exemption #2 (via path-dep on kevy-lua). Same
#    verification: `cargo tree -p kevy-lua-host` must show luna-core
#    as the only third-party crate.
# 4. `crates/kevy-ring` + `crates/kevy-rt` may depend on `loom` under
#    `[target.'cfg(loom)'.dependencies]` — a concurrency-model checker
#    pulled in ONLY under `RUSTFLAGS="--cfg loom"` for the loom test
#    suites. A normal build / test / publish never sees it (same
#    posture as the `fuzz/` dirs' libfuzzer-sys). Verify it stays out
#    of the default graph: `cargo tree -p kevy-rt | grep loom` is empty
#    without the cfg.
#
# These exemptions are per-crate. The default server, blocking-client,
# embedded, and persistence stacks remain 0 third-party deps.
[workspace]
resolver = "3"
members = [
    "crates/kevy-tmpdir",
    "crates/kevy-time",
    "crates/kevy-scalar",
    "crates/kevy-sys",
    "crates/kevy-seg",
    "crates/kevy-window",
    "crates/kevy-uring",
    "crates/kevy-madvise",
    "crates/kevy-resp",
    "crates/kevy-ring",
    "crates/kevy-store",
    "crates/kevy-compress",
    "crates/kevy-vlog",
    "crates/kevy-rt",
    "crates/kevy-persist",
    "crates/kevy",
    "crates/kevy-sql",
    "crates/kevy-cli",
    "crates/kevy-pubsub-bench",
    "crates/kevy-alloc",
    "crates/kevy-bench",
    "crates/kevy-hash",
    "crates/kevy-index",
    "crates/kevy-text",
    "crates/kevy-vector",
    "crates/kevy-bytes",
    "crates/kevy-map",
    "crates/kevy-ranktree",
    "crates/kevy-resp-client",
    "crates/kevy-config",
    "crates/kevy-embedded",
    "crates/kevy-client",
    "crates/kevy-geo",
    "crates/kevy-replicate",
    "crates/kevy-cluster-rw",
    "crates/kevy-elect",
    "crates/kevy-scope",
    "crates/kevy-client-async",
    "crates/kevy-lua",
    "crates/kevy-lua-host",
    "crates/kevy-chaos",
    "crates/kevy-mcp",
    "crates/kevy-ffi",
    "crates/kevy-jni",
    "crates/kevy-napi",
    "crates/kevy-wasm",
]

# STANDALONE, deliberately-excluded crates. These depend on the `tauri` crate
# (an unavoidable ecosystem dependency for a Tauri plugin / app) and therefore
# must NOT join the 0-dependency workspace — keeping `tauri` out of the root
# build graph preserves the pure-Rust, 0-dep charter. Each also carries its own
# empty `[workspace]` table so it roots its own build when invoked directly.
# See bindings/tauri/README.md for the full boundary note.
exclude = [
    "bindings/tauri/tauri-plugin-kevy",
    "bindings/tauri/example/src-tauri",
]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.97.0"
authors = ["GOLIA K.K."]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/kevy"
homepage = "https://github.com/goliajp/kevy"

# `documentation` is intentionally NOT inherited at the workspace level —
# each publishable crate sets its own `documentation = "https://docs.rs/
# <crate-name>"` so the link resolves to the crate's own docs.rs page,
# not a hard-coded one. Matches the mailrs publish model.

# Lint policy shared across every workspace member. Matches the project
# policy: warnings are deny (clippy + rustc both). Per-crate manifests
# opt in via `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# v3.18 T5d pedantic sweep: every stone crate was run with `-W clippy::pedantic`
# and each finding was either fixed or `#[allow]`ed in place with a reason. The
# lints below fired in bulk (~330 sites) for patterns that are deliberate across
# the codebase, so they are allowed here once instead of per-site:
#   - must_use_candidate: blanket #[must_use] on every getter adds API noise
#     without a concrete misuse it would catch.
#   - doc_markdown: prose style (backticks on identifiers); not enforced.
#   - missing_errors_doc: error semantics are documented in prose in each fn's
#     doc body, not as mandatory `# Errors` headings.
#   - cast_*: the stone crates cast at bit level by design (geohash packing,
#     CRC tables, u32 doc/node ids bounded by construction, OS ABI fields,
#     BM25/HNSW f64 math); sites were reviewed in the sweep, none truncate
#     outside their documented domain.
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release codegen, but readable under a profiler. `strip = true` above is
# right for what ships and wrong for what you measure: a perf record of the
# release binary resolves nothing but libc, so every frame of our own code
# comes back a bare address. Three phrase-query profiles were spent finding
# that out. Same opt-level/lto/codegen-units as release — the thing being
# measured has to be the thing that ships — plus the symbols to attribute it.
# Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = 1

# Size-optimized profile: opt-level "z" + same hardening. Used to measure
# the size/perf trade-off of opt-level "z" vs the default release profile.
# Invoke with `cargo build --profile release-min`.
[profile.release-min]
inherits = "release"
opt-level = "s"

# IoT profile: smallest-binary settings for the embedded /
# edge builds bench/iotgate.sh budgets. opt-level "z" trades speed for
# size; fat LTO + 1 cgu let the linker drop every unused subsystem;
# strip removes symbols. Invoke with `cargo build --profile iot`.
[profile.iot]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Perf-profile profile: same codegen as `release` (LTO + 1 cgu + abort) plus
# line-table debug info and forced frame pointers so `perf record` /
# flamegraph can resolve every symbol back to a Rust function + line.
# Strip is OFF here (would erase the .debug_line we just added). Used by
# bench/PERF-PROFILE-*.md investigations; never ship binaries built with
# this — they're ~3× larger.
[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false
split-debuginfo = "off"
