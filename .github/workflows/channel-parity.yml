# Does the newest release actually exist on every door?
#
# Every other gate in this repository reads the tree: the manifests agree
# with each other, the vendored engine bytes report the right version, the
# compat claim matches the verb list. All of them passed on 2026-08-30
# while six published doors served code from five releases earlier, because
# no gate had ever asked a registry a question. The tree was telling the
# truth about itself; nobody was asking the world.
#
# It asks about the newest v* tag, not the working tree — between releases
# the tree is supposed to be ahead, and a permanently red gate is a gate
# nobody reads. So a red here means one thing only: a release was announced
# that a user cannot install.
#
# After a release rather than per-push because the answer changes when a
# release publishes, not when the code does, and because 50-odd requests to
# nine public registries on every pull request would make CI flaky in a way
# that teaches people to ignore it.
name: channel parity — does the world have what we shipped

on:
  # When a release ends, because that is the one moment the answer is
  # supposed to change: v6.1.0's npm job refused a door it could not build,
  # and four publishable doors behind it never got their turn. Red here
  # after a release means the release is not finished. The tag publishes
  # every door except PyPI, NuGet and Maven Central, which the owner
  # dispatches, so right after a release those three are expected here
  # until then; each door found behind is printed with what publishes it.
  # Dispatch this again after those three to confirm the release is whole.
  workflow_run:
    workflows: ['Release']  # exact `name:` of release.yml — matching is by name
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to ask about (blank = newest v* tag)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  parity:
    name: every door serves the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the gate reads git tags to find the release
      - run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
      - name: ask every registry
        # Through the environment, not interpolated into the command line:
        # a dispatch input pasted into a shell is an injection, and the
        # value here comes from whoever pressed the button.
        env:
          ASK_VERSION: ${{ inputs.version }}
        run: |
          # Branching rather than an unquoted $ASK_VERSION: unquoted, a
          # value with a space becomes two arguments and one with a glob
          # character becomes whatever is in the working directory. Quoted
          # unconditionally, the empty default becomes an empty argument
          # and the script asks about version "".
          if [ -n "$ASK_VERSION" ]; then
            python3 tools/check_channels_published.py "$ASK_VERSION"
          else
            python3 tools/check_channels_published.py
          fi
