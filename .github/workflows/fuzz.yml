name: Fuzz

# The long fuzz run: every target in CI's fuzz-smoke matrix, five minutes
# each, on Linux x86_64 (the production target). Daily rather than per-push:
# every push already fuzzes each target for 60 s in ci.yml, and a long run
# on every push held most of the org's shared runners for half an hour.
#
# One list. The matrix is read from ci.yml's fuzz-smoke job by
# tools/check_fuzz_matrix.py, which also holds that list to the targets in
# the tree, so a target added there is fuzzed here too.
#
# Charter note: cargo-fuzz and libfuzzer-sys are crates.io dev-only tools
# (same exemption as cargo-llvm-cov). They never enter the runtime
# dependency closure of any published kevy crate; each fuzz/ directory
# uses its own isolated workspace.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (default 300)'
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  targets:
    name: the fuzz-smoke list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "include=$(python3 tools/check_fuzz_matrix.py --json)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.crate }}/${{ matrix.target }} (linux x86_64)
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # the org shares 20 runners
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.duration_seconds || '300' }}
    steps:
      - uses: actions/checkout@v7

      # cargo-fuzz needs nightly (libfuzzer-sys and the -Zsanitizer
      # machinery are not on stable); `cargo +nightly` overrides the stable
      # channel the repository pins.
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --component rust-src --no-self-update

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache fuzz target build
        uses: actions/cache@v6
        with:
          path: |
            crates/${{ matrix.crate }}/fuzz/target
            crates/${{ matrix.crate }}/fuzz/corpus
          key: fuzz-${{ matrix.crate }}-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('crates/{0}/fuzz/Cargo.lock', matrix.crate)) }}
          restore-keys: |
            fuzz-${{ matrix.crate }}-${{ matrix.target }}-${{ runner.os }}-

      # -max_total_time bounds wall-clock; any libfuzzer crash fails the
      # step and the offending input is uploaded below.
      - name: Run ${{ matrix.crate }}/${{ matrix.target }} for ${{ env.FUZZ_SECONDS }}s
        working-directory: crates/${{ matrix.crate }}/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_SECONDS }}

      - name: Upload crash artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.crate }}-${{ matrix.target }}
          path: |
            crates/${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}/
            crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
