"$schema" = "schemas/schema.json"

# The default permission set. kevy-embedded is a LOCAL, in-process store with
# no remote surface and no auth boundary — the whole point of the embedded door
# is full in-app access. So the default grants every command. An app that wants
# a narrower webview surface (say, read-only: only `get`/`exists`/`ping`) omits
# this set from its capability and lists the individual `allow-*` identifiers
# instead — each is autogenerated from `build.rs::COMMANDS`.
[default]
description = "Full access to the embedded kevy store: raw cmd, typed key ops, and pub/sub streaming."
permissions = [
    "allow-cmd",
    "allow-get",
    "allow-set",
    "allow-del",
    "allow-exists",
    "allow-incr",
    "allow-ping",
    "allow-dbsize",
    "allow-flushall",
    "allow-publish",
    "allow-subscribe",
    "allow-unsubscribe",
]
