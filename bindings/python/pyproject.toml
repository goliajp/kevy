[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kevy"
version = "4.0.0"
description = "First-party Python client for kevy — the pure-Rust Redis-compatible engine (embedded + remote, blocking + asyncio)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "GOLIA K.K." }]
keywords = ["kevy", "redis", "resp", "key-value", "database", "asyncio"]

# Zero runtime dependencies: the embedded door is ctypes (stdlib), the
# remote door is socket/asyncio (stdlib). The wire is bytes throughout.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools]
packages = ["kevy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
